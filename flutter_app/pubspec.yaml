name: music_app
description: A beautiful music streaming app like Spotify with new releases and free music.

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI & Design
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.7
  lottie: ^2.6.0
  shimmer: ^3.0.0
  
  # State Management
  provider: ^6.0.0
  riverpod: ^2.4.0
  
  # Networking
  dio: ^5.3.1
  http: ^1.1.0
  
  # Audio & Media
  just_audio: ^0.9.31
  audio_video_progress_bar: ^0.10.0
  
  # Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  
  # Navigation
  go_router: ^12.0.1
  
  # Local database
  sqflite: ^2.3.0
  
  # Utilities
  intl: ^0.19.0
  uuid: ^4.0.0
  logger: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.6
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/

